<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#162d43;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#132b46;color:white;padding:calc(18px + env(safe-area-inset-top)) 16px 16px}header .bar{max-width:980px;margin:auto;display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}small{opacity:.8}main{max-width:980px;margin:auto;padding:12px}.card{border:1px solid #e0e7ee;background:white;border-radius:14px;margin-bottom:12px;overflow:hidden}.toolbar{display:flex;align-items:center;justify-content:space-between;padding:12px}.toolbar strong{font-size:18px}.summary{display:flex;gap:12px}.stat{flex:1;padding:14px}.stat strong{font-size:24px;display:block}.stat small{color:#64748b}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid orange;outline-offset:2px}.action{border:0;background:#166b83;color:white;padding:10px 13px;border-radius:9px}.secondary{border:1px solid #d0dde8;background:white;color:#243f59;min-width:42px;min-height:42px;border-radius:9px}.gridtitle{display:flex;align-items:center;justify-content:space-between;padding:14px}.gridtitle small{color:#64748b}.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.matrix{border-collapse:separate;border-spacing:0;font-size:12px}.matrix th,.matrix td{text-align:center;border-bottom:1px solid #e8eff4;border-right:1px solid #e8eff4;height:48px;min-width:38px}.matrix thead th{background:#eaf1f6;height:36px}.matrix .name{position:sticky;left:0;z-index:2;background:#fff;min-width:145px;width:145px;text-align:left;padding:0 8px;box-shadow:2px 0 5px #1232}.matrix thead .name{background:#eaf1f6;z-index:3}.matrix .total{position:sticky;right:0;z-index:2;min-width:53px;background:#eaf1f6;font-weight:700}.matrix thead .total{z-index:4}.habitbtn{border:0;background:none;font-size:12px;font-weight:650;text-align:left;color:#23415f;overflow-wrap:anywhere}.tick{border:1px solid #cbd5df;background:white;width:30px;height:30px; </style></head><body><header><div class="bar"><div><h1>Habit Grid</h1><small>One day at a time.</small></div><button class="action" id="add">+ Habit</button></div></header>
<main><div class="card toolbar"><button class="secondary" id="previous" aria-label="Previous month">‹</button><strong id="month"></strong><button class="secondary" id="next" aria-label="Next month">›</button></div>
<div class="summary"><div class="card stat"><strong id="done">0</strong><small>Completed checkmarks</small></div><div class="card stat"><strong id="rate">0%</strong><small>Monthly completion</small></div></div>

<script>
(()=>{"use strict";const KEY="habitgrid.v1";const initial={habits:[{id:"h1",name:"Morning workout"},{id:"h2",name:"Read"},{id:"h3",name:"Study"},{id:"h4",name:"Drink water"}],checks:{}};const $=id=>document.getElementById(id);let data;try{const stored=JSON.parse(localStorage.getItem(KEY));data=stored&&Array.isArray(stored.habits)&&stored.checks?stored:initial}catch{data=initial}let now=new Date(),year=now.getFullYear(),month=now.getMonth(),editing=null;const pad=n=>String(n).padStart(2,"0"),date=day=>year+"-"+pad(month+1)+"-"+pad(day),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));window.dispatchEvent(new Event("habitgrid:change"))}catch{alert("Storage is unavailable. Your changes may not persist.")}},esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function draw(){const days=new Date(year,month+1,0).getDate();$("month").textContent=new Date(year,month,1).toLocaleString(undefined,{month:"long",year:"numeric"});let html='<thead><tr><th class="name">HABIT</th>';for(let d=1;d<=days;d++)html+='<th>'+d+'</th>';html+='<th class="total">TOTAL</th></tr></thead><tbody>';let done=0;for(const habit of data.habits){let count=0;html+='<tr><th class="name"><button class="habitbtn" data-edit="'+esc(habit.id)+'">'+esc(habit.name)+'</button></th>';for(let d=1;d<=days;d++){const checked=!!data.checks[habit.id+"|"+date(d)];if(checked)count++;html+='<td><button class="tick '+(checked?"on":"")+'" aria-pressed="'+checked+'" aria-label="'+esc(habit.name)+" "+date(d)+'" data-id="'+esc(habit.id)+'" data-day="'+d+'">'+(checked?"✓":"")+'</button></td>'}done+=count;html+='<td class="total">'+count+'</td></tr>'}html+='</tbody>';if(!data.habits.length)html='<tr><td class="empty">Add your first habit using + Habit.</td></tr>';$("grid").innerHTML=html;$("done").textContent=done;$("rate").textContent=(data.habits.length?Math.round(100*done/(days*data.habits.length)):0)+"%"}function edit(id=null){editing=id;$("heading").textContent=id?"Edit habit":"Add habit";$("habit").value=data.habits.find(h=>h.id===id)?.name||"";$("remove").hidden=!id;$("edit").showModal();$("habit").focus()}$("grid").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.edit){edit(b.dataset.edit);return}if(!b.dataset.day)return;const k=b.dataset.id+"|"+date(Number(b.dataset.day));data.checks[k]=!data.checks[k];save();const x=$("scroll").scrollLeft;draw();$("scroll").scrollLeft=x});$("add").onclick=()=>edit();$("cancel").onclick=()=>$("edit").close();$("editor").onsubmit=e=>{e.preventDefault();const name=$("habit").value.trim();if(!name)return;if(editing){const h=data.habits.find(h=>h.id===editing);if(h)h.name=name}else data.habits.push({id:crypto.randomUUID?.()||"h"+Date.now(),name});save();$("edit").close();draw()};$("remove").onclick=()=>{if(!editing||!confirm("Delete this habit and its history?"))return;data.habits=data.habits.filter(h=>h.id!==editing);Object.keys(data.checks).filter(k=>k.startsWith(editing+"|")).forEach(k=>delete data.checks[k]);save();$("edit").close();draw()};function move(n){const d=new Date(year,month+n,1);year=d.getFullYear();month=d.getMonth();draw();$("scroll").scrollLeft=0}$("previous").onclick=()=>move(-1);$("next").onclick=()=>move(1);$("today").onclick=()=>{const d=new Date();year=d.getFullYear();month=d.getMonth();draw();$("scroll").scrollLeft=0};window.HabitGridApply=next=>{data=next;try{localStorage.setItem(KEY,JSON.stringify(data))}catch{}draw()};draw();if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{})})();
</script><script>window.HABIT_GRID_GOOGLE_CLIENT_ID="333769205869-6cvbk2d78ao2tr9v80j7doh0ccl2klaq.apps.googleusercontent.com";</script><script src="https://accounts.google.com/gsi/client" async defer></script><script src="./sync.js?v=4" defer></script></body></html>
