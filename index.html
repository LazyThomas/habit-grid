<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#162d43;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#132b46;color:white;padding:calc(18px + env(safe-area-inset-top)) 16px 16px}header .bar{max-width:980px;margin:auto;display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}small{opacity:.8}main{max-width:980px;margin:auto;padding:12px}.card{border:1px solid #e0e7ee;background:white;border-radius:14px;margin-bottom:12px;overflow:hidden}.toolbar{display:flex;align-items:center;justify-content:space-between;padding:12px}.toolbar strong{font-size:18px}.summary{display:flex;gap:12px}.stat{flex:1;padding:14px}.stat strong{font-size:24px;display:block}.stat small{color:#64748b}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid orange;outline-offset:2px}.action{border:0;background:#166b83;color:white;padding:10px 13px;border-radius:9px}.secondary{border:1px solid #d0dde8;background:white;color:#243f59;min-width:42px;min-height:42px;border-radius:9px}.gridtitle{display:flex;align-items:center;justify-content:space-between;padding:14px}.gridtitle small{color:#64748b}.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.matrix{border-collapse:separate;border-spacing:0;font-size:12px}.matrix th,.matrix td{text-align:center;border-bottom:1px solid #e8eff4;border-right:1px solid #e8eff4;height:48px;min-width:38px}.matrix thead th{background:#eaf1f6;height:36px}.matrix .name{position:sticky;left:0;z-index:2;background:#fff;min-width:145px;width:145px;text-align:left;padding:0 8px;box-shadow:2px 0 5px #1232}.matrix thead .name{background:#eaf1f6;z-index:3}.matrix .total{position:sticky;right:0;z-index:2;min-width:53px;background:#eaf1f6;font-weight:700}.matrix thead .total{z-index:4}.habitbtn{border:0;background:none;font-size:12px;font-weight:650;text-align:left;color:#23415f;overflow-wrap:anywhere}.tick{border:1px solid #cbd5df;background:white;width:30px;height:30px;border-radius:7px;color:white;font-size:20px}.tick.on{background:#16817e;border-color:#16817e}.foot{padding:13px;display:flex;justify-content:space-between;align-items:center;gap:10px}.foot small{color:#667a88}.status{text-align:center;color:#61788b;font-size:12px;padding:9px 8px 28px}dialog{border:0;border-radius:16px;padding:20px;max-width:calc(100vw - 26px);width:390px;box-shadow:0 15px 50px #0005}dialog::backdrop{background:#102b4499}dialog input{font:inherit;width:100%;padding:12px;margin:8px 0 12px;border:1px solid #c7d4df;border-radius:8px}dialog label{font-size:13px;font-weight:600}dialog menu{display:flex;justify-content:flex-end;gap:8px;padding:0;margin:10px 0 0}#remove{color:#b42336;margin-right:auto}.empty{padding:30px;color:#6b7b89}@media(max-width:480px){.matrix .name{min-width:132px;width:132px}.matrix th,.matrix td{min-width:36px}}

</style></head><body><header><div class="bar"><div><h1>Habit Grid</h1><small>One day at a time.</small></div><button class="action" id="add">+ Habit</button></div></header>
<main><div class="card toolbar"><button class="secondary" id="previous" aria-label="Previous month">‹</button><strong id="month"></strong><button class="secondary" id="next" aria-label="Next month">›</button></div>
<div class="summary"><div class="card stat"><strong id="done">0</strong><small>Completed checkmarks</small></div><div class="card stat"><strong id="rate">0%</strong><small>Monthly completion</small></div></div>

<section class="card"><div class="gridtitle"><b>7-day trends</b><small id="range"></small></div><div class="trends" id="trends"></div><div id="spark"></div></section>
<div class="status" id="status">Saved on this device · Offline available</div></main>
